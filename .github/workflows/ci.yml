name: CI

# Validation only — nothing here pushes images or touches the VPS.
# Runs on every PR and on every push, so main always gets checked too.
on:
  pull_request:
  push:
    branches: ['**']

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # No test/lint script exists in backend/package.json today — this is a
      # real syntax-validity check (parses without executing, so it needs no
      # secrets/DB/API key), not a stand-in for tests that don't exist yet.
      - run: node --check index.js && node --check db.js && node --check auth.js && node --check prompts.js && node --check schema.js

  docker-build-test:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
