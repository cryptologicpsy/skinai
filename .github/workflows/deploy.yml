name: Deploy

# Only ever runs for pushes to main (or a manual trigger) — PRs only get
# ci.yml. This workflow will fail (safely — it just won't deploy) until the
# VPS_HOST / VPS_SSH_USER / VPS_SSH_KEY secrets below are configured and the
# one-time VPS setup in docs/deployment.md has been done.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # required to push images to GHCR with the built-in GITHUB_TOKEN

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Images are tagged with the commit SHA only — never :latest — so
      # docker-compose.prod.yml's required IMAGE_TAG always points at an
      # exact, reproducible build.
      - name: Build + push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skinai-frontend:${{ github.sha }}

      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skinai-backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Skips cleanly (rather than failing loudly) if the VPS secrets haven't
    # been configured yet — lets build-and-push run/validate on its own.
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ vars.VPS_DEPLOY_PATH || '/opt/skinai' }}
            GHCR_OWNER=${{ env.IMAGE_OWNER }} ./scripts/deploy-remote.sh ${{ github.sha }}
