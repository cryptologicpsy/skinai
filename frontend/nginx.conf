server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routing (react-router-dom) owns all paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fonts/assets are content-hashed by Vite; cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
